name: Reusable fuzz gates

on:
  workflow_call:
    inputs:
      duration_seconds:
        description: Seconds to run each fuzz target
        required: false
        type: number
        default: 300

permissions:
  contents: read

jobs:
  fuzz:
    name: Four libFuzzer targets
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build

      - name: Build non-installed fuzz targets
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build/fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DSEQPRO_BUILD_TOOLS=OFF \
            -DSEQPRO_BUILD_SEQUENCE_TEXT=ON \
            -DSEQPRO_BUILD_FUZZERS=ON \
            -DSEQPRO_WARNINGS_AS_ERRORS=ON
          cmake --build build/fuzz --parallel 2

      - name: Run bounded fuzz campaigns
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          TMPDIR: /tmp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          FUZZ_DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          set -o pipefail
          mkdir -p fuzz-results
          declare -A corpus_directories=(
            [seqpro-fuzz-fasta-index]=fasta_index
            [seqpro-fuzz-metadata]=metadata
            [seqpro-fuzz-fasta-scanner]=fasta_scanner
            [seqpro-fuzz-sequence-text]=sequence_text
          )
          for fuzz_target in \
            seqpro-fuzz-fasta-index \
            seqpro-fuzz-metadata \
            seqpro-fuzz-fasta-scanner \
            seqpro-fuzz-sequence-text; do
            result_directory="fuzz-results/${fuzz_target}"
            corpus_directory="${result_directory}/corpus"
            artifact_directory="${result_directory}/artifacts"
            mkdir -p "${corpus_directory}" "${artifact_directory}"
            cp -a "fuzz/corpus/${corpus_directories[${fuzz_target}]}/." \
              "${corpus_directory}/"
            "build/fuzz/fuzz/${fuzz_target}" \
              -artifact_prefix="${artifact_directory}/" \
              -max_len=65536 \
              -max_total_time="${FUZZ_DURATION_SECONDS}" \
              -rss_limit_mb=4096 \
              -timeout=5 \
              "${corpus_directory}" \
              2>&1 | tee "${result_directory}/fuzzer.log"
          done

      - name: Upload corpora, logs, and failure inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz-results
          if-no-files-found: error
          retention-days: 7
