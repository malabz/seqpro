name: Reusable quality gates

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  minimum-toolchains:
    name: Minimum ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: ${{ matrix.container_image }}
      options: --platform linux/amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 9.5 / CMake 3.20.6 / core
            container_image: >-
              gcc:9.5.0-bullseye@sha256:c4572f5aed5b02f4e137595b33cffc28d74babf16d496e41c5b22ccb2999d330
            compiler_family: gcc
            c_compiler: gcc
            cxx_compiler: g++
            sequence_text: "OFF"
          - name: Clang 10 / CMake 3.20.6 / SequenceText
            container_image: >-
              ubuntu:20.04@sha256:c664f8f86ed5a386b0a340d981b8f81714e21a8b9c73f658c4bea56aa179d54a
            compiler_family: clang
            c_compiler: clang-10
            cxx_compiler: clang++-10
            sequence_text: "ON"
    steps:
      - name: Install GCC container prerequisites
        if: matrix.compiler_family == 'gcc'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git ninja-build

      - name: Install Clang 10 container prerequisites
        if: matrix.compiler_family == 'clang'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates clang-10 curl g++ git ninja-build

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned CMake 3.20.6
        run: |
          curl -fsSL \
            https://github.com/Kitware/CMake/releases/download/v3.20.6/cmake-3.20.6-linux-x86_64.tar.gz \
            -o /tmp/cmake-3.20.6-linux-x86_64.tar.gz
          echo "458777097903b0f35a0452266b923f0a2f5b62fe331e636e2dcc4b636b768e36  /tmp/cmake-3.20.6-linux-x86_64.tar.gz" \
            | sha256sum --check
          mkdir -p /opt/cmake-3.20.6
          tar -xzf /tmp/cmake-3.20.6-linux-x86_64.tar.gz \
            --strip-components=1 -C /opt/cmake-3.20.6
          /opt/cmake-3.20.6/bin/cmake --version

      - name: Build and test minimum toolchain
        env:
          CC: ${{ matrix.c_compiler }}
          CXX: ${{ matrix.cxx_compiler }}
        run: |
          export PATH="/opt/cmake-3.20.6/bin:${PATH}"
          test "$(cmake --version | sed -n '1s/^cmake version //p')" = "3.20.6"
          cmake -S . -B build/minimum -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=ON \
            -DSEQPRO_BUILD_TOOLS=ON \
            -DSEQPRO_BUILD_EXAMPLES=ON \
            -DSEQPRO_BUILD_SEQUENCE_TEXT=${{ matrix.sequence_text }} \
            -DSEQPRO_WARNINGS_AS_ERRORS=ON
          cmake --build build/minimum --parallel 2
          ctest --test-dir build/minimum --output-on-failure

  modern-build-matrix:
    name: ${{ matrix.compiler.name }} / ${{ matrix.build_type }} / ${{ matrix.linkage }} / text ${{ matrix.sequence_text }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC 13
            cc: gcc-13
            cxx: g++-13
          - name: Clang 18
            cc: clang-18
            cxx: clang++-18
        build_type: [Debug, Release]
        linkage: [static, shared]
        sequence_text: ["OFF", "ON"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install compilers and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 gcc-13 g++-13 ninja-build

      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          if [[ "${{ matrix.linkage }}" == "shared" ]]; then
            shared_libraries=ON
          else
            shared_libraries=OFF
          fi
          cmake -S . -B build/modern -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_SHARED_LIBS="${shared_libraries}" \
            -DBUILD_TESTING=ON \
            -DSEQPRO_BUILD_TOOLS=ON \
            -DSEQPRO_BUILD_EXAMPLES=ON \
            -DSEQPRO_BUILD_BENCHMARKS=ON \
            -DSEQPRO_BUILD_SEQUENCE_TEXT=${{ matrix.sequence_text }} \
            -DSEQPRO_WARNINGS_AS_ERRORS=ON

      - name: Build and test
        run: |
          cmake --build build/modern --parallel 2
          ctest --test-dir build/modern --output-on-failure

  sanitizers:
    name: Clang 18 ASan / UBSan / LSan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build

      - name: Build and test with sanitizers
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          sanitizer_flags="-fsanitize=address,undefined,leak -fno-omit-frame-pointer"
          cmake -S . -B build/sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="${sanitizer_flags}" \
            -DCMAKE_EXE_LINKER_FLAGS="${sanitizer_flags}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=ON \
            -DSEQPRO_BUILD_TOOLS=ON \
            -DSEQPRO_BUILD_EXAMPLES=ON \
            -DSEQPRO_BUILD_SEQUENCE_TEXT=ON \
            -DSEQPRO_WARNINGS_AS_ERRORS=ON
          cmake --build build/sanitizers --parallel 2
          ctest --test-dir build/sanitizers --output-on-failure \
            -R '^seqpro\\.(unit|sequence_text\\.unit)$'

  thread-sanitizer:
    name: GCC 13 ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build

      - name: Build and run concurrent-query tests
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          sanitizer_flags="-fsanitize=thread -fno-omit-frame-pointer"
          cmake -S . -B build/thread-sanitizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="${sanitizer_flags}" \
            -DCMAKE_EXE_LINKER_FLAGS="${sanitizer_flags}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=ON \
            -DSEQPRO_BUILD_TOOLS=OFF \
            -DSEQPRO_BUILD_SEQUENCE_TEXT=ON \
            -DSEQPRO_WARNINGS_AS_ERRORS=ON
          cmake --build build/thread-sanitizer --parallel 2
          ctest --test-dir build/thread-sanitizer --output-on-failure \
            -R '^seqpro\\.(unit|sequence_text\\.unit)$'

  static-analysis:
    name: Formatting / clang-tidy / naming
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 clang-format-18 clang-tidy-18 curl ninja-build shellcheck

      - name: Check formatting and source conventions
        run: |
          bash scripts/check_format.sh clang-format-18
          cmake -DSEQPRO_SOURCE_DIR="${PWD}" \
            -P cmake/CheckSourceConventions.cmake
          git diff --check

      - name: Validate GitHub Actions workflows
        run: |
          shellcheck scripts/*.sh
          curl -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o /tmp/actionlint-1.7.7.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint-1.7.7.tar.gz" \
            | sha256sum --check
          mkdir -p /tmp/actionlint-1.7.7
          tar -xzf /tmp/actionlint-1.7.7.tar.gz -C /tmp/actionlint-1.7.7
          /tmp/actionlint-1.7.7/actionlint -no-color

      - name: Build every owned target under clang-tidy
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build/clang-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DSEQPRO_BUILD_TOOLS=ON \
            -DSEQPRO_BUILD_EXAMPLES=ON \
            -DSEQPRO_BUILD_BENCHMARKS=ON \
            -DSEQPRO_BUILD_SEQUENCE_TEXT=ON \
            -DSEQPRO_ENABLE_CLANG_TIDY=ON \
            -DSEQPRO_CLANG_TIDY_EXECUTABLE="$(command -v clang-tidy-18)" \
            -DSEQPRO_WARNINGS_AS_ERRORS=ON
          cmake --build build/clang-tidy --parallel 2

  gcc-analyzer:
    name: GCC 13 static analyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build

      - name: Build with -fanalyzer
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          # GCC 13 and 14 both emit these two diagnostics from libstdc++ internals while
          # analyzing std::string and std::unordered_map. Keep every other analyzer check fatal.
          cmake -S . -B build/gcc-analyzer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fanalyzer -Wno-analyzer-malloc-leak -Wno-analyzer-use-of-uninitialized-value" \
            -DBUILD_TESTING=ON \
            -DSEQPRO_BUILD_TOOLS=ON \
            -DSEQPRO_BUILD_EXAMPLES=ON \
            -DSEQPRO_BUILD_SEQUENCE_TEXT=ON \
            -DSEQPRO_WARNINGS_AS_ERRORS=ON
          cmake --build build/gcc-analyzer --parallel 2

  documentation:
    name: Strict Doxygen API documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen ninja-build

      - name: Generate strict API documentation
        run: |
          cmake -S . -B build/documentation -G Ninja \
            -DSEQPRO_BUILD_TOOLS=OFF \
            -DSEQPRO_BUILD_SEQUENCE_TEXT=ON \
            -DSEQPRO_BUILD_DOCUMENTATION=ON
          cmake --build build/documentation --target seqpro-docs

  samtools-interop:
    name: Samtools 1.24 interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned Samtools 1.24
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bzip2 gcc make libbz2-dev libcurl4-openssl-dev \
            liblzma-dev libncurses-dev zlib1g-dev
          curl -fsSL \
            https://github.com/samtools/samtools/releases/download/1.24/samtools-1.24.tar.bz2 \
            -o /tmp/samtools-1.24.tar.bz2
          echo "89b2a440123eeaa400392ce1736e7d60ce9041843027d76819753c5a8246bfdd  /tmp/samtools-1.24.tar.bz2" \
            | sha256sum --check
          mkdir -p /tmp/samtools-source /tmp/samtools-prefix
          tar -xjf /tmp/samtools-1.24.tar.bz2 \
            --strip-components=1 -C /tmp/samtools-source
          (
            cd /tmp/samtools-source
            ./configure --prefix=/tmp/samtools-prefix
            make -j2
            make install
          )
          /tmp/samtools-prefix/bin/samtools --version | sed -n '1p'

      - name: Run bidirectional FAI tests
        env:
          PATH: /tmp/samtools-prefix/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          cmake -S . -B build/samtools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DSEQPRO_BUILD_TOOLS=ON \
            -DSEQPRO_BUILD_SEQUENCE_TEXT=OFF \
            -DSEQPRO_WARNINGS_AS_ERRORS=ON
          cmake --build build/samtools --parallel 2
          ctest --test-dir build/samtools --output-on-failure \
            -R '^seqpro\\.integration\\.samtools$'

  package-and-abi:
    name: Shared package / symbols / ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            abigail-tools gcc-13 g++-13 ninja-build

      - name: Build and validate the shared package
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build/package -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DSEQPRO_BUILD_TOOLS=ON \
            -DSEQPRO_BUILD_SEQUENCE_TEXT=ON \
            -DSEQPRO_ENABLE_ABI_CHECKS=ON \
            -DSEQPRO_WARNINGS_AS_ERRORS=ON
          cmake --build build/package --parallel 2
          ctest --test-dir build/package --output-on-failure
