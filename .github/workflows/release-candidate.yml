name: Release candidate

on:
  workflow_dispatch:
    inputs:
      fuzz_duration_seconds:
        description: Seconds to run each fuzz target
        required: true
        default: "300"
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
    permissions:
      contents: read

  fuzz:
    uses: ./.github/workflows/_fuzz.yml
    with:
      duration_seconds: ${{ fromJSON(inputs.fuzz_duration_seconds) }}
    permissions:
      contents: read

  source-and-doc-assets:
    name: Reproducible source and API documentation
    needs:
      - quality
      - fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the complete source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install release-candidate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen gcc-13 g++-13 ninja-build

      - name: Generate strict API documentation
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build/release-docs -G Ninja \
            -DSEQPRO_BUILD_TOOLS=OFF \
            -DSEQPRO_BUILD_SEQUENCE_TEXT=ON \
            -DSEQPRO_BUILD_DOCUMENTATION=ON
          cmake --build build/release-docs --target seqpro-docs

      - name: Build reproducible source candidate twice
        run: |
          bash scripts/build_release_candidate.sh \
            . release-artifacts "${GITHUB_SHA}"
          source_archive=$(find release-artifacts -maxdepth 1 \
            -name 'seqpro-0.2.0-rc.*.tar.gz' -print -quit)
          test -n "${source_archive}"
          bash scripts/validate_release_archive.sh "${source_archive}"

      - name: Package API documentation reproducibly
        run: |
          source_date_epoch=$(git show -s --format=%ct "${GITHUB_SHA}")
          tar --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 --group=0 --numeric-owner \
            -C build/release-docs/api-docs \
            -cf - html \
            | gzip -n -9 \
            > release-artifacts/seqpro-0.2.0-api-docs.tar.gz
          sha256sum release-artifacts/seqpro-0.2.0-api-docs.tar.gz \
            > release-artifacts/seqpro-0.2.0-api-docs.tar.gz.sha256

      - name: Record release-candidate summary
        run: |
          {
            echo "## SeqPro 0.2.0 release candidate"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Quality gates: passed"
            echo "- Four bounded fuzz campaigns: passed"
            echo "- Source archive reproducibility comparison: passed"
            echo "- Extract/build/install/relocate/consume validation: passed"
            echo "- Tag or GitHub Release created: no"
            echo
            echo "### Checksums"
            echo
            echo '```text'
            cat release-artifacts/*.sha256
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload candidate assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seqpro-0.2.0-release-candidate-${{ github.sha }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14
