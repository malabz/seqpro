name: Fuzz

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Seconds to run each fuzz target
        required: true
        default: "300"
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    uses: ./.github/workflows/_fuzz.yml
    with:
      duration_seconds: ${{ fromJSON(inputs.duration_seconds) }}
    permissions:
      contents: read
